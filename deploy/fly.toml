# App name and ALLOWED_ORIGINS are injected from validated release settings.
primary_region = "gru"
kill_signal = "SIGTERM"
kill_timeout = 10
[build]
  dockerfile = "Dockerfile"
[env]
  NODE_ENV = "production"
  PORT = "8080"
  MAX_CONNECTIONS = "64"
  MAX_CONNECTIONS_PER_ADDRESS = "16"
  MAX_UPGRADES_PER_MINUTE = "120"
  TRUST_FLY_PROXY = "1"
  ABROZ_CHAMPIONSHIP_PATH = "/data/championships/history.sqlite"
  ABROZ_RECOVERY_ENABLED = "1"
  ABROZ_RECOVERY_PATH = "/data/checkpoints/state.bin"
# Provision this encrypted 1 GB volume before deploying. One machine owns it.
[[mounts]]
  source = "abroz_recovery"
  destination = "/data"
[deploy]
  strategy = "rolling"
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "connections"
    soft_limit = 80
    hard_limit = 100
  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"
[[vm]]
  cpu_kind = "performance"
  cpus = 1
  memory_mb = 2048
