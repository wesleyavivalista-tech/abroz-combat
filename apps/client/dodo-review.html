<!doctype html><html lang="en"><meta charset="utf-8"><title>Dodo — movement and portraits</title><style>*{box-sizing:border-box}body{margin:24px;background:#10151d;color:#eee;font:16px system-ui}nav{display:flex;gap:24px;align-items:center}a{color:#cbe5ff}canvas{display:block;width:100%;background:#202733}.portraits{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.portraits img{width:100%;height:420px;object-fit:contain}.portraits section{background:repeating-conic-gradient(#252a32 0% 25%,#171c24 0% 50%) 0/24px 24px}h2{font-size:18px}</style><h1>Dodo review</h1><nav><a href="/">Back to game</a><label>Animation <select id="motion"><option value="WalkForward">Walk forward</option><option value="WalkBackward">Walk backward</option><option value="guitarSwing">Guitar attack</option><option value="Idle">Ready stance</option><option value="MatchWin">Victory pose</option></select></label><label><input type="checkbox" id="pause">Pause</label><button id="show-victory">Preview victory screen</button></nav><p>Leaf-print outfit · Black T-shirt outfit</p><div id="models"></div><div class="portraits"><section><h2>First skin</h2><img src="/art/dodo/portrait-approved-leaf-v5.png"></section><section><h2>Second skin</h2><img src="/art/dodo/portrait-approved-black-v5.png"></section><section><h2>Victory</h2><img src="/art/dodo/victory-playing-v5.png"></section></div><script type="module">
import './src/ui/match-overlays.css';import './src/ui/dodo-portraits.css';import {resultScreen} from './src/ui/ResultScreen.ts';import {GameSimulation} from '../../packages/game-core/simulation/GameSimulation.ts';
import * as THREE from 'three';import {loadDodo} from './src/rendering/DodoRenderer.ts';import {createFighter} from '../../packages/game-core/simulation/Fighter.ts';import {characters} from '../../packages/game-core/characters/registry.ts';
const scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(-2.8,2.8,2.5,-.15,.1,30);camera.position.z=10;const renderer=new THREE.WebGLRenderer({alpha:true});renderer.setPixelRatio(Math.min(2,devicePixelRatio));document.querySelector('#models').append(renderer.domElement);const models=[];
await loadDodo((id,make,skin)=>{if(!['original','black'].includes(skin))return;const f=createFighter('dodo',1200,1),visual=make(),slot=new THREE.Group();slot.position.x=skin==='original'?-1.4:1.4;slot.add(visual.root);scene.add(slot);models.push({f,visual});});
let tick=0,last=0;function draw(t){if(t-last>1000/60){last=t;if(!document.querySelector('#pause').checked)tick++;for(const {f,visual} of models){const pose=document.querySelector('#motion').value;if(pose==='guitarSwing'){const m=characters.dodo.moves.guitarSwing;f.move=pose;f.moveFrame=tick%(m.startupFrames+m.activeFrames+m.recoveryFrames);f.state=m.state;}else{f.move=null;f.state=pose;}f.weaponUntil=pose==='MatchWin'?1000:0;f.stateFrame=tick;visual.update(f,tick/60);}renderer.render(scene,camera);}requestAnimationFrame(draw);}requestAnimationFrame(draw);function size(){renderer.setSize(Math.min(1000,innerWidth-48),360);}addEventListener('resize',size);size();
document.querySelector('#show-victory').onclick=()=>{const s=new GameSimulation(['dodo','gut']).state;s.winner=0;s.fighters[1].lives=0;const host=document.createElement('div');host.innerHTML=resultScreen(s,'local','DODO',()=> '');document.body.append(host);host.querySelector('dialog').showModal();host.querySelectorAll('button').forEach(b=>b.onclick=()=>host.remove());host.querySelector('dialog').addEventListener('close',()=>host.remove());};
</script></html>
