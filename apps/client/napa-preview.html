<!doctype html><html><head><meta charset="utf-8"><title>Napa · Cookie Monster summon</title><style>body{margin:0;background:#141c26;color:#f4ead6;font:16px system-ui}header{padding:22px 30px;display:flex;gap:24px;align-items:center}h1{font-size:24px;margin:0}button,select,input{font:inherit}button,select{padding:8px 14px;background:#354255;color:inherit;border:1px solid #89919a;border-radius:5px}canvas{display:block;width:100%;height:65vh;background:linear-gradient(#192938,#1c2630)}footer{padding:15px 30px}a{color:#e5b56e}#status{color:#ecc486}label{display:flex;gap:8px;align-items:center}#timeline{width:35vw}</style></head><body><header><h1>NAPA / BAKED TO LIFE</h1><select id="skin" aria-label="Skin"><option value="original">Brown tee</option><option value="gym">Gym tank</option></select><button id="replay">Replay summon</button><button id="pause">Pause</button><select id="mode" aria-label="Preview"><option value="summon">Cookie Monster</option><option value="walk">Walking</option></select></header><canvas></canvas><footer><label>Animation <input id="timeline" aria-label="Animation frame" type="range" min="0" max="225" value="0"><span id="status">Loading…</span></label><p>Knead → bake → place cookie → crack open → Cookie Monster. <a href="/">Play Napa in the game</a></p></footer><script type="module">
import * as THREE from 'three';
import {GameSimulation} from '../../packages/game-core/simulation/GameSimulation.ts';
import {Button} from '../../packages/game-core/types.ts';
import {characters} from '../../packages/game-core/characters/registry.ts';
import {loadFighterSprites,createFighterVisual} from './src/rendering/VisualRegistry.ts';
import {NapaEffects} from './src/rendering/NapaEffects.ts';
const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('canvas'),alpha:true,antialias:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));const scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(-3.5,5.5,3.9,-.3,.1,50);camera.position.z=10;const effects=new NapaEffects();scene.add(effects.root);let visual,boss,paused=false,tick=0,last=0,g;
function reset(){g=new GameSimulation(['napa','gut']);g.state.phase='fight';g.state.fighters.forEach(f=>{f.state='Idle';f.meter=100;});g.state.fighters[0].x=1200;g.state.fighters[1].x=2400;g.step([Button.Super1,0]);tick=0;}
try{await loadFighterSprites(['napa']);const switchSkin=()=>{if(visual){scene.remove(visual.root);visual.dispose();}visual=createFighterVisual(characters.napa,document.querySelector('#skin').value);scene.add(visual.root);};switchSkin();boss=createFighterVisual(characters.napa,'cookie-monster');scene.add(boss.root);reset();document.querySelector('#skin').onchange=switchSkin;document.querySelector('#replay').onclick=()=>{reset();paused=false;document.querySelector('#pause').textContent='Pause';};document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Play':'Pause';};document.querySelector('#timeline').oninput=e=>{paused=true;document.querySelector('#pause').textContent='Play';const target=+e.target.value;reset();for(let i=0;i<target;i++)g.step([0,0]);tick=target;};document.querySelector('#mode').onchange=()=>{reset();};const resize=()=>renderer.setSize(innerWidth,innerHeight*.65,false);addEventListener('resize',resize);resize();function draw(now){if(now-last>=1000/60){last=now;const walking=document.querySelector('#mode').value==='walk';if(!paused){tick++;if(!walking){if(tick>280)reset();else g.step([0,0]);}}const f=g.state.fighters[0];visual.update(walking?{...f,move:null,state:'WalkForward',stateFrame:tick}:f,tick/60);effects.update(g.state,walking);boss.root.visible=!walking&&g.state.clones.length>0;if(boss.root.visible)boss.update(g.state.clones[0].fighter,tick/60);document.querySelector('#timeline').value=Math.min(tick,225);document.querySelector('#status').textContent=walking?'Both legs alternate':tick<30?'Kneading':tick<95?'Baking':tick<135?'Placing cookie':tick<180?'Monster emerging':'Monster active';renderer.render(scene,camera);}requestAnimationFrame(draw);}requestAnimationFrame(draw);}catch(error){document.querySelector('#status').textContent=error.message;console.error(error);}
</script></body></html>
