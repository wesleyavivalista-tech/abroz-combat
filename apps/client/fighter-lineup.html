<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fighter style lineup · Abroz Combat</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#151a22;color:#f3f1eb;font:14px system-ui,sans-serif}header{padding:24px 30px 18px;display:flex;justify-content:space-between;align-items:center;gap:24px}h1{font-size:25px;margin:0 0 7px}p{margin:0;color:#aeb9c8}nav{display:flex;align-items:center;gap:14px;flex-wrap:wrap}button,select{background:#293342;border:1px solid #556174;border-radius:6px;padding:8px 12px;color:inherit;font:inherit}label{display:flex;gap:8px;align-items:center}main{overflow:auto;padding:0 24px 24px}.lineup{width:100%;min-width:1200px}section{margin-bottom:24px}h2{font-size:12px;letter-spacing:2px;color:#d9bb78;margin:12px 0 0}canvas{display:block;width:100%;height:auto;background:linear-gradient(transparent calc(100% - 25px),#77829355 calc(100% - 24px),transparent calc(100% - 23px))}.names{display:grid;grid-template-columns:repeat(8,1fr);text-align:center}.names b{display:block;font-size:13px}.names small{color:#aeb9c8;display:block;margin-top:4px}.names .summon-hp{color:#dfc388;font-weight:700}body.light .names .summon-hp{color:#57431d}#status{padding:0 30px;color:#d9bb78}a{color:#dfc388}body.light{background:#c6cbd0;color:#18202c}body.light p,body.light small{color:#445166}body.light h2{color:#57431d}
</style></head><body><header><div><h1>Fighter style lineup</h1><p>Actual in-game models · shared ground line and game scale · both skins, companions, transformations, mounted forms and zombies</p></div><nav><label>Pose <select id="pose"><option value="Idle">Ready</option><option value="WalkForward">Walk</option><option value="DashForward">Dash forward</option><option value="DashBackward">Dash backward</option><option value="Crouch">Crouch</option><option value="Jump">Jump</option><option value="Fall">Fall</option><option value="CrouchingAttack">Crouching attack</option><option value="GroundAttack">Grounded attack</option><option value="AirAttack">Airborne attack</option></select></label><label>Attack preview <select id="attack-preview"><option value="strike">Strike</option><option value="windup">Windup</option><option value="recovery">Recovery</option><option value="loop">Animate</option></select></label><label>Zombies <select id="zombie-preview"><option value="follow">Follow pose</option><option value="rising">Emerge</option><option value="hurt">Hurt</option><option value="dying">Collapse</option></select></label><a href="#zombies">Jump to zombies</a><label>Zoom <input id="zoom" type="range" min="100" max="180" value="100" aria-label="Lineup zoom"></label><button id="background">Light background</button><a href="/">Back to game</a></nav></header><p id="status">Loading fighter models…</p><main><div class="lineup"></div></main>
<script type="module">
import * as THREE from 'three';
import {ZombieSpriteRenderer,loadZombieSprites} from './src/rendering/ZombieSpriteRenderer.ts';
import {INVASION_VARIANTS,INVADER_STATS,invaderAttackStart} from '../../packages/game-core/simulation/InvasionSystem.ts';
import {ZOMBIE_CLAW} from '../../packages/game-core/simulation/UndeadSystem.ts';
import {characters} from '../../packages/game-core/characters/registry.ts';
import {EIDE} from '../../packages/game-core/simulation/EideSystem.ts';
import {NAPA} from '../../packages/game-core/simulation/NapaSystem.ts';
import {JOPA} from '../../packages/game-core/simulation/JopaSystem.ts';
import {createFighter} from '../../packages/game-core/simulation/Fighter.ts';
import {loadFighterSprites,createFighterVisual} from './src/rendering/VisualRegistry.ts';
const lineup=document.querySelector('.lineup'),rows=[];
const roster=Object.values(characters);const lineupWidth=roster.length*2.1;
const skinRows=Array.from({length:Math.max(...roster.map(c=>c.skins.length))},(_,index)=>[index===0?'FIRST SKINS':index===1?'SECOND SKINS':`SKIN ${index+1}`,roster.filter(c=>c.skins[index]).map(c=>({id:c.id,skin:c.skins[index].id,name:c.displayName,detail:c.skins[index].name}))]);
const groups=[...skinRows,['COMPANIONS',[{id:'eide',skin:'blonde-0',name:'BLONDE 1',detail:'Blue blouse',hp:EIDE.npcHealth,loveNpc:true},{id:'eide',skin:'blonde-1',name:'BLONDE 2',detail:'Burgundy tee',hp:EIDE.npcHealth,loveNpc:true},...[0,1,2].map(i=>({id:'dodo',skin:`pain-killer-${i}`,name:`PAINKILLER ${i+1}`,detail:'Painkillers uniform',hp:Math.floor(characters.dodo.stats.maxHealth*.4)-120})),{id:'bozo',skin:'hair-clone',name:'HAIR CLONE',detail:'Bozo companion',hp:Math.floor(characters.bozo.stats.maxHealth/3)-60},...['sad','angry'].flatMap(personality=>['original','casual'].map(skin=>({id:'astolfo',skin:personality+(skin==='casual'?'-casual':''),name:personality==='sad'?'SAD ASTOLFO':'ANGRY ASTOLFO',detail:skin==='casual'?'Pale blue shirt':'Charcoal suit',hp:Math.floor(characters.astolfo.stats.maxHealth*(personality==='sad'?1:.5))-(personality==='angry'?260:0),personality}))) ]],['GIANT FORMS',[{id:'eide',skin:'original',name:'MUTANT EIDE',detail:'Suco lover · 20 seconds',weaponUntil:999999},{id:'napa',skin:'cookie-monster',name:'COOKIE MONSTER',detail:'Napa companion',hp:Math.floor(characters.napa.stats.maxHealth*NAPA.monsterHealth)+NAPA.monsterBonusHealth,cookieBoss:true},{id:'drupa',skin:'original',name:'GIANT BUDA',detail:'Drupa transformation · actual game scale',weaponUntil:999999}]]];
groups.splice(skinRows.length,0,['ZOMBIES · WALK TO SHAMBLE / GROUNDED ATTACK TO CLAW',roster.map(c=>({id:c.id,name:'ZOMBIE '+c.displayName,detail:'Illustrated undead · one life',hp:c.stats.maxHealth,zombie:true}))]);
const active=999999;
groups.splice(skinRows.length+1,0,['TRANSFORMATIONS',[
 ...characters.eide.skins.map(skin=>({id:'eide',skin:skin.id,name:'LOVE EIDE',detail:skin.name,loveMode:true})),
 {id:'fausto',skin:'original',name:'SAMURAI FAUSTO',detail:'Ancestry',weaponUntil:active},
 ...['original','casual'].map(skin=>({id:'fausto',skin,name:'ANGRY FAUSTO',detail:skin==='casual'?'Oversized tee · Bravinho':'Black suit · Bravinho',angerUntil:active})),
 {id:'fausto',skin:'original',name:'ANGRY SAMURAI',detail:'Ancestry + Bravinho',weaponUntil:active,angerUntil:active},
 ...['original','black'].map(skin=>({id:'caio',skin,name:'BLOOD MASTER CAIO',detail:skin==='black'?'Blackout':'Teal & gold',bloodMasterUntil:active})),
 {id:'roms',skin:'original',name:'ARMORED ROMS',detail:'Full firefighter gear',armorUntil:active},
 {id:'bozo',skin:'original',name:'HAIR ARMOR BOZO',detail:'Shares Hair Clone model',armorUntil:active},
 ...characters.jomp.skins.map(skin=>({id:'jomp',skin:skin.id,name:'COOL MUSCLES JOMP',detail:skin.name,weaponUntil:active})),
]],['WEAPON FORMS',[
 ...characters.biel.skins.map(skin=>({id:'biel',skin:skin.id,name:'LOAN STAMP BIEL',detail:skin.name,stampAttempts:5})),
 ...characters.dodo.skins.map(skin=>({id:'dodo',skin:skin.id,name:'GUITAR DODO',detail:skin.name,weaponUntil:active})),
 ...['original','kung-fu'].map(skin=>({id:'gut',skin,name:'SPEAR GUT',detail:skin==='kung-fu'?'Kung fu':'Dress shirt',weaponUntil:active})),
]]);
groups.push(['BEE-BOX CARRYING',characters.nikalz.skins.map(skin=>({id:'nikalz',skin:skin.id,name:'NIKALZ',detail:skin.name+' · carrying bee boxes',beeBoxes:5}))],['MMORPG BIEL FORM',[{id:'biel',skin:'original',name:'MMORPG BIEL',detail:'MMORPG addicted · shared by both skins',angelUntil:active}]],
 ['JOPA SUMMONS',[{id:'jopa',skin:'tree',name:'CRYING TREE',detail:'Jopa transformation',hp:Math.round(characters.jopa.stats.maxHealth*JOPA.treeHealth)},{id:'jopa',skin:'tentacle',name:'TREE TENTACLE',detail:'Jopa companion',hp:Math.round(characters.jopa.stats.maxHealth*JOPA.tentacleHealth)},{id:'jopa',skin:'knight',name:'CHESS KNIGHT',detail:'Jopa mount',hp:JOPA.knightHealth}]],
 ...skinRows.map(([title,entries])=>['MOUNTED · '+title,entries.map(e=>({...e,jopaRide:0}))]));
groups.splice(skinRows.length+1,0,['INVASION ZOMBIES · PT / BOLSONARO',INVASION_VARIANTS.map(variant=>({id:'gut',invasion:variant,zombie:true,hp:INVADER_STATS[variant].health,name:({'pt-normal':'PT · NORMAL','pt-flag':'PT · FLAG','pt-heavy':'PT · HEAVY','br-normal':'BOLSONARO · NORMAL','br-flag':'BOLSONARO · FLAG','br-revolver':'BOLSONARO · REVOLVER'})[variant],detail:({'pt-normal':'Basic melee','pt-flag':'PT flag','pt-heavy':'Scythe + hammer · three-hit combo','br-normal':'Basic melee','br-flag':'Brazil flag','br-revolver':'Slow revolver shots'})[variant]}))]);
try{
 await Promise.all([loadFighterSprites(),loadZombieSprites()]);
 for(const [title,entries] of groups){
  const giant=title==='GIANT FORMS',weapons=title==='WEAPON FORMS',large=title==='JOPA SUMMONS'||title==='MMORPG BIEL FORM',columns=title.startsWith('INVASION')?8:weapons?7:giant||large?6:roster.length,spacing=lineupWidth/columns,viewHeight=giant?6.2:weapons||large?4.8:2.95;
  const section=document.createElement('section');if(title.startsWith('ZOMBIES'))section.id='zombies';const heading=document.createElement('h2');heading.textContent=title;section.append(heading);lineup.append(section);
  const renderer=new THREE.WebGLRenderer({alpha:true,antialias:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));section.append(renderer.domElement);
  const scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(-spacing/2,lineupWidth-spacing/2,viewHeight-.3,-.3,.1,50);camera.position.z=10;
  scene.add(new THREE.AmbientLight(0xffffff,2));const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(0,4,5);scene.add(light);
  const names=document.createElement('div');names.className='names';names.style.gridTemplateColumns='repeat('+columns+',1fr)';section.append(names);
  const models=entries.map((e,i)=>{const f=createFighter(e.id,1200,1);f.state='Idle';if(e.personality)f.personality=e.personality;if(e.cookieBoss)f.cookieBoss=true;for(const key of ['weaponUntil','angerUntil','bloodMasterUntil','armorUntil','angelUntil','stampAttempts','jopaRide','loveMode','loveNpc','beeBoxes'])if(e[key]!==undefined)f[key]=e[key];const visual=e.zombie?new ZombieSpriteRenderer(e.invasion??e.id,undefined,e.invasion):createFighterVisual(characters[e.id],e.skin);const slot=new THREE.Group();slot.position.x=i*spacing;slot.add(visual.root);scene.add(slot);const name=document.createElement('div');const b=document.createElement('b');b.textContent=e.name;const small=document.createElement('small');small.textContent=e.detail;name.append(b,small);if(e.hp!==undefined){const hp=document.createElement('small');hp.className='summon-hp';hp.textContent=e.hp.toLocaleString('en-US')+' HP';name.append(hp);}names.append(name);return {f,visual,zombie:e.zombie,invasion:e.invasion,undead:e.zombie?{phaseAt:0,target:-1,nextAttack:0,attackAt:0,attackFrame:0,hit:false,stuck:0,lastX:1200,spawnX:1200,spawnY:0}:null};});
  rows.push({renderer,scene,camera,models,viewHeight});
 }
 document.querySelector('#status').remove();
 let last=0,tick=0;function draw(now){if(now-last>=1000/30){last=now;const pose=document.querySelector('#pose').value;tick+=2;for(const row of rows){for(const {f,visual,zombie,invasion,undead} of row.models){
 if(zombie){
  const attacking=pose.endsWith('Attack'),preview=document.querySelector('#attack-preview').value;
  f.undead='zombie';f.state=attacking?'LightAttack':pose==='WalkForward'?'WalkForward':pose==='Jump'||pose==='Fall'?pose:'Idle';
  f.x=1200+(pose==='WalkForward'?tick*2.2:0);f.y=0;
  const attackStart=invasion?invaderAttackStart(invasion):ZOMBIE_CLAW.startupFrames,attackEnd=invasion?INVADER_STATS[invasion].end:36;
  undead.attackFrame=preview==='windup'?8:preview==='recovery'?(invasion?attackEnd-4:30):preview==='loop'?tick%(invasion?attackEnd+18:84):attackStart;
  if(attacking&&undead.attackFrame>=attackEnd)f.state='Idle';
  const zombiePreview=document.querySelector('#zombie-preview').value;f.stun=zombiePreview==='hurt'?2:0;
  if(zombiePreview==='rising'||zombiePreview==='dying'){f.undead=zombiePreview;undead.phaseAt=tick-tick%(zombiePreview==='rising'?90:60);}
  visual.update(f,undead,tick);visual.root.position.x=0;continue;
 }
 const def=characters[f.characterId];const basics=f.weaponUntil&&def.weaponAttacks?def.weaponAttacks:def.basicAttacks;f.move=pose==='AirAttack'||pose==='GroundAttack'||pose==='CrouchingAttack'?(f.stampAttempts!==undefined?'stamp':pose==='AirAttack'?basics?.air??null:pose==='CrouchingAttack'?basics?.crouch??null:basics?.chain[0]??null):null;f.y=pose==='AirAttack'?40:0;const attack=f.move?def.moves[f.move]:null;const preview=document.querySelector('#attack-preview').value;f.moveFrame=attack?(preview==='windup'?0:preview==='recovery'?attack.startupFrames+attack.activeFrames+3:preview==='loop'?tick%(attack.startupFrames+attack.activeFrames+attack.recoveryFrames+18):attack.startupFrames):0;f.state=pose==='GroundAttack'?'LightAttack':pose;if(attack&&f.moveFrame>=attack.startupFrames+attack.activeFrames+attack.recoveryFrames){f.move=null;f.state=pose==='CrouchingAttack'?'Crouch':pose==='AirAttack'?'Fall':'Idle';}f.stateFrame=pose.startsWith('Dash')?tick%12:pose==='WalkForward'||f.angelUntil?tick:0;visual.update(f,now/1000);}row.renderer.render(row.scene,row.camera);}}requestAnimationFrame(draw);}requestAnimationFrame(draw);
 function resize(){const width=lineup.clientWidth;for(const row of rows)row.renderer.setSize(width,width*row.viewHeight/lineupWidth,false);}new ResizeObserver(resize).observe(lineup);resize();
 document.querySelector('#zoom').oninput=e=>{lineup.style.width=e.target.value+'%';};
 document.querySelector('#background').onclick=e=>{const light=document.body.classList.toggle('light');e.target.textContent=light?'Dark background':'Light background';};
}catch(error){document.querySelector('#status').textContent='Could not load the lineup: '+error.message;console.error(error);}
</script></body></html>
