name: Build desktop candidates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.draft.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Create private draft candidate (never publish)
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="desktop-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" --draft --target "$GITHUB_SHA" --title "Desktop candidate ${GITHUB_SHA:0:7}" --notes "Unsigned QA builds. Not approved for public distribution. Verify all three platforms, compatibility metadata and checksums before uploading to R2."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  package:
    needs: prepare
    permissions:
      contents: write
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win --x64
            label: windows-x64
          - os: macos-latest
            target: --mac --arm64
            label: macos-arm64
          - os: macos-latest
            target: --mac --x64
            label: macos-x64
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      VITE_WS_URL: ${{ vars.VITE_WS_URL }}
      ABROZ_BUILD_VERSION: ${{ github.sha }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test:desktop
      - run: pnpm build:desktop -- ${{ matrix.target }}
      - name: Retain installers and verification metadata in draft
        env:
          GH_TOKEN: ${{ github.token }}
          ABROZ_CANDIDATE_TAG: ${{ needs.prepare.outputs.tag }}
          ABROZ_CANDIDATE_PLATFORM: ${{ matrix.label }}
        run: node scripts/upload-desktop-candidate.mjs
